# docker compose up -d --build
# Every port binds to 127.0.0.1 on the host on purpose. Share what you need over Tailscale:
#   tailscale serve --bg --tcp 5432 tcp://localhost:5432     # Postgres, from your Mac
#   tailscale serve --bg --tcp 8765 tcp://localhost:8765     # MCP server
#   tailscale serve --bg --https 6080 http://localhost:6080  # live browser (phone)
#   tailscale serve --bg --tcp 9222 tcp://localhost:9222     # CDP for Codex
# Never bind these to 0.0.0.0 on a home network.
x-app: &app
  build: .
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql://jobs:${POSTGRES_PASSWORD}@postgres:5432/jobs
  depends_on: {postgres: {condition: service_healthy}}

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobs
      POSTGRES_DB: jobs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobs -d jobs"]
      interval: 5s
      retries: 10

  crawler:
    <<: *app
    command: python -m jobpipeline.crawler
    volumes: ["./config:/app/config:ro"]

  screening:
    <<: *app
    command: python -m jobpipeline.screening
    volumes: ["./config:/app/config:ro"]
    # lets RESUME_SERVICE_URL=http://host.docker.internal:<port> reach a service running on the host
    extra_hosts: ["host.docker.internal:host-gateway"]

  mcp:
    <<: *app
    command: python -m jobpipeline.mcp_server --http --host 0.0.0.0 --port 8765
    volumes: ["./data:/app/data:ro"]
    ports: ["127.0.0.1:8765:8765"]

  browser:
    build: ./browser
    restart: unless-stopped
    environment:
      VNC_PASSWORD: ${VNC_PASSWORD:?set VNC_PASSWORD in .env}
    volumes: ["browser-profile:/profile"]   # keeps ATS logins between restarts
    shm_size: 1gb                           # Chromium crashes with Docker's 64 MB default
    ports: ["127.0.0.1:6080:6080", "127.0.0.1:9222:9222"]

  backup:
    image: postgres:16
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes: ["./backups:/backups"]
    depends_on: {postgres: {condition: service_healthy}}
    # nightly dump, keep 14 days
    entrypoint: ["sh", "-c", "while true; do pg_dump -h postgres -U jobs jobs | gzip > /backups/jobs-$$(date +%F).sql.gz && find /backups -name '*.sql.gz' -mtime +14 -delete; sleep 86400; done"]

volumes:
  pgdata:
  browser-profile:
