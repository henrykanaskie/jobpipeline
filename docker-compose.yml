# docker compose up -d   — Postgres + crawler + screening (+ MCP over HTTP on the host's Tailscale IP)
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobs
      POSTGRES_DB: jobs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    # Bound to localhost only. Reach it from your Mac over Tailscale with
    #   tailscale serve --tcp 5432 tcp://localhost:5432
    # (or change to "<tailscale-ip>:5432:5432"). Never bind to 0.0.0.0 on a home network.
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobs -d jobs"]
      interval: 5s
      retries: 10

  crawler:
    build: .
    command: python -m jobpipeline.crawler
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://jobs:${POSTGRES_PASSWORD}@postgres:5432/jobs
    volumes: ["./config:/app/config:ro"]
    depends_on: {postgres: {condition: service_healthy}}

  screening:
    build: .
    command: python -m jobpipeline.screening
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://jobs:${POSTGRES_PASSWORD}@postgres:5432/jobs
    volumes: ["./config:/app/config:ro"]
    depends_on: {postgres: {condition: service_healthy}}

  mcp:
    build: .
    command: python -m jobpipeline.mcp_server --http --host 0.0.0.0 --port 8765
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://jobs:${POSTGRES_PASSWORD}@postgres:5432/jobs
    # Localhost only; expose to your tailnet with: tailscale serve --tcp 8765 tcp://localhost:8765
    ports: ["127.0.0.1:8765:8765"]
    depends_on: {postgres: {condition: service_healthy}}

volumes:
  pgdata:
