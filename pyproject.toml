[project]
name = "jobpipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.1",
    "requests>=2.31",
    "PyYAML>=6.0",
    "mcp>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["jobpipeline", "jobpipeline.sources"]

[tool.pytest.ini_options]
testpaths = ["tests"]
