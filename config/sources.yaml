# Boards to crawl. `token` is the slug in the board's URL:
#   greenhouse: boards.greenhouse.io/<token>     lever: jobs.lever.co/<token>
#   ashby:      jobs.ashbyhq.com/<token>
# These are examples: check each one returns jobs (python -m jobpipeline.crawler --once) before relying on it.
greenhouse:
  - {token: stripe, company: Stripe}
  - {token: discord, company: Discord}
  - {token: databricks, company: Databricks}
lever:
  - {token: palantir, company: Palantir}
ashby:
  - {token: ramp, company: Ramp}
  - {token: notion, company: Notion}
simplify:
  - token: new-grad
    url: https://raw.githubusercontent.com/SimplifyJobs/New-Grad-Positions/dev/.github/scripts/listings.json
# Workday: `url` is the career-site page you'd open in a browser. Always set `search`
# (each crawl reads at most 200 postings per board). Unofficial API: expect breakage.
workday:
  - token: nvidia
    company: NVIDIA
    url: https://nvidia.wd5.myworkdayjobs.com/NVIDIAExternalCareerSite
    search: software engineer
# Latest "Ask HN: Who is hiring?" thread. Parsing is best-effort; the pre-filter does the rest.
hackernews:
  - {token: whoishiring}
